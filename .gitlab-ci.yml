image: rwthika/ros2-ml:humble-desktop-full-tf2.18.0-torch2.5.0

before_script:
  - apt-get update && apt-get install -y

stages:
  - formatting
  - typing
  - docs

lint:
  stage: formatting
  tags:
    - lint
  script:
    - pip install docformatter==1.7.6
    - pip install ruff
    - python -m docformatter --recursive --in-place --wrap-summaries 100 --wrap-descriptions 100 launch zat_saver
    - python -m ruff check

mypy:
  stage: typing
  tags:
    - mypy
  script:
    - pip install mypy
    - python -m mypy --install-types --non-interactive --ignore-missing-imports zat_saver/

docstr:
  stage: docs
  tags:
    - docstr
  script:
    - pip install docstr-coverage
    - docstr-coverage zat_saver/ --skip-private --skip-magic